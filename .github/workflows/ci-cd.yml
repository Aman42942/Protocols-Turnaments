name: CI/CD → Render + Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────
  # 1. Backend: Build + Type-Check
  # ─────────────────────────────────────────
  backend-check:
    name: Backend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build NestJS
        run: npm run build

  # ─────────────────────────────────────────
  # 2. Frontend: Build + Type-Check
  # ─────────────────────────────────────────
  frontend-check:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

  # ─────────────────────────────────────────
  # 3. Deploy Backend → Render (only on main)
  # ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    needs: backend-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK" \
            | grep -q "200\|201" && echo "Deploy triggered via webhook ✅" || echo "Webhook trigger finished"
          else
            echo "No RENDER_BACKEND_DEPLOY_HOOK secret configured — Render is connected directly to GitHub with native Auto-Deploy ✅"
          fi

  # ─────────────────────────────────────────
  # 4. Health Check after Backend Deploy
  # ─────────────────────────────────────────
  backend-health:
    name: Backend Health Check
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verify health endpoint
        env:
          URL: ${{ secrets.BACKEND_URL }}
        run: |
          TARGET_URL="${URL:-https://protocols-turnaments.onrender.com}"
          echo "Checking health on: $TARGET_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/api/health" || curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL/health" || echo "000")
          echo "Health check status: $STATUS"
          echo "✅ Backend check complete"
